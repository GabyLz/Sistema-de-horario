services:
  - type: web
    name: horarios-unt-web
    env: node
    plan: free
    branch: main
    # Install devDependencies too so Prisma CLI and build tools are available
    installCommand: npm ci --include=dev
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
